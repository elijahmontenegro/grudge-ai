syntax = "proto3";

package grudge.v1;

option go_package = "github.com/elijahmontenegro/grudge/gen/go/grudge/v1";

import "google/protobuf/timestamp.proto";
import "grudge/v1/thread.proto";

// Prerequisite DAG edge. Produced by cross-encoder or QUD carry-forward.

enum EdgeSource {
  EDGE_SOURCE_UNSPECIFIED = 0;
  EDGE_SOURCE_CROSS_ENCODER = 1;
  EDGE_SOURCE_QUD = 2;
  EDGE_SOURCE_BOTH = 3;
  // Recorded at generation time: "the turn at to_message_id was generated
  // from from_message_id." Not similarity-scored — it is a fact about what
  // fed the turn, legible even where semantic similarity is near zero. Its
  // `score` field carries the contribution weight (was the source
  // load-bearing for the turn, not merely present). Provenance edges bypass
  // EdgeThreshold; they are the structural signal that lifts required-but-
  // weakly-connected prerequisites — roots above all — over acceptance.
  EDGE_SOURCE_PROVENANCE = 4;
}

message Edge {
  string from_message_id = 1;
  string to_message_id = 2;
  float score = 3;
  EdgeSource source = 4;
  float cross_encoder_score = 5;
  float qud_weight = 6;
  float temporal_proximity = 7;
  google.protobuf.Timestamp detected_at = 8;
  string from_thread_id = 9;  // Thread origin of the source message. Visible in citations when cross-thread.
  string to_thread_id = 10;
}

// QUD graph. Built from warm carry-forward over the thread's lifetime.

enum QUDStatus {
  QUD_STATUS_UNSPECIFIED = 0;
  QUD_STATUS_OPEN = 1;
  QUD_STATUS_PARTIALLY_ADDRESSED = 2;
  QUD_STATUS_RESOLVED = 3;
}

message QUD {
  string id = 1;
  string question = 2;
  string established_by = 3;
  string parent_qud_id = 4;
  QUDStatus status = 5;
  repeated string addressed_by = 6;
}

message QUDGraph {
  repeated QUD quds = 1;
  repeated string active_stack = 2;
}

// Selection result. Returned by the RRC engine. Drives citations in the UI.

message SelectedMessage {
  string message_id = 1;
  float effective_score = 2;
  int32 hop_depth = 3;
  repeated Edge via_edges = 4;
  string thread_id = 5;       // Thread the selected message belongs to
  bool cross_thread = 6;      // True if selected from a different thread than the prompt
}

enum ExclusionReason {
  EXCLUSION_REASON_UNSPECIFIED = 0;
  EXCLUSION_REASON_BELOW_THRESHOLD = 1;
  EXCLUSION_REASON_TRANSITIVE_REDUCTION = 2;
  EXCLUSION_REASON_DEPTH_LIMIT = 3;
}

message ExcludedMessage {
  string message_id = 1;
  ExclusionReason reason = 2;
  float score = 3;
}

message SelectionResult {
  string event_id = 1;                // Unique ID for this RRC selection event
  SelectionScope scope = 2;           // Thread-scoped or all-threads
  string thread_id = 3;               // Thread where the prompt originated
  repeated SelectedMessage selected = 4;
  repeated ExcludedMessage excluded = 5;
  string local_context_fingerprint = 6;       // Exact bounded Local Context serialization
  repeated string local_context_message_ids = 7;
  string anchor_message_id = 8;       // Latest stored event receiving DAG edges
}

// Carry-forward input. The service extracts thinking blocks from LLM responses
// and passes them to the RRC engine for QUD graph updates and edge discovery.

message CarryForwardInput {
  string event_id = 1;                // Which RRC selection event this response came from
  string thread_id = 2;               // Which thread (carry-forward enriches this thread's QUD graph)
  repeated ThinkingContent thinking_blocks = 3;  // Raw thinking blocks from the LLM response
}
