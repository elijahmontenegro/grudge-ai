syntax = "proto3";

package spidey.v1;

option go_package = "github.com/emontenegr/spidey/gen/go/spidey/v1";

import "google/protobuf/timestamp.proto";

// The lossless corpus. A conversation is an ordered sequence of immutable messages.

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
  ROLE_SYSTEM = 3;
}

message Message {
  string id = 1;
  Role role = 2;
  string content = 3;
  int64 position = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Conversation {
  string id = 1;
  repeated Message messages = 2;
}
