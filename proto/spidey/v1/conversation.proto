syntax = "proto3";

package spidey.v1;

option go_package = "github.com/emontenegr/spidey/gen/go/spidey/v1";

import "google/protobuf/timestamp.proto";

// The lossless corpus. A conversation is an ordered sequence of immutable messages.

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
  ROLE_SYSTEM = 3;
}

// Content block types. A message contains one or more of these.

message ContentBlock {
  oneof block {
    TextContent text = 1;
    ThinkingContent thinking = 2;
    ToolCallContent tool_call = 3;
    ToolResultContent tool_result = 4;
    ImageContent image = 5;
  }
}

message TextContent {
  string text = 1;
}

message ThinkingContent {
  string text = 1;
}

message ToolCallContent {
  string id = 1;
  string name = 2;
  string arguments = 3; // JSON-encoded arguments
}

message ToolResultContent {
  string tool_call_id = 1;
  string content = 2;
  bool is_error = 3;
}

message ImageContent {
  string media_type = 1;
  bytes data = 2;
}

// Corpus message. The persistent record in a conversation.
// Has identity and position metadata beyond what the LLM sees.

message Message {
  string id = 1;
  Role role = 2;
  repeated ContentBlock content = 3;
  int64 position = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Conversation {
  string id = 1;
  repeated Message messages = 2;
}
