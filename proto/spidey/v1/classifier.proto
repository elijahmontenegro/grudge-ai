syntax = "proto3";

package spidey.v1;

option go_package = "github.com/emontenegr/spidey/gen/go/spidey/v1";

// Classifier interface types. Cross-encoder pattern: two texts in, class probabilities out.
// Provider-agnostic — the RRC engine uses this without knowing the backend.

message ClassifyRequest {
  string text_a = 1;
  string text_b = 2;
}

message ClassifyResponse {
  repeated ClassLabel labels = 1;
}

message ClassLabel {
  string name = 1;
  float probability = 2;
}

// Batch variant for scoring a new message against all predecessors.

message BatchClassifyRequest {
  repeated ClassifyRequest pairs = 1;
}

message BatchClassifyResponse {
  repeated ClassifyResponse results = 1;
}
