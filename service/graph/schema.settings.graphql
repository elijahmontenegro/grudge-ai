type Settings {
  providers: String!
  permissions: String!
  mcpServers: String!
  hooks: String!
  preferences: String!
  """
  Engine config as JSON: { edgeThreshold, scoreFloor, weightCE, weightTemp, radiusSize, rerankTopK }.
  Live-tunable — the RRC engine re-projects stored edges under the new config
  at walk time, so saving here changes Selection behavior on the next turn
  without a restart. Raw reranker scores are preserved; only the fused
  projection shifts.
  """
  engine: String!
}

input SettingsInput {
  providers: String
  permissions: String
  mcpServers: String
  hooks: String
  preferences: String
  engine: String
}

type SkillInfo {
  name: String!
  description: String!
}

extend type Query {
  settings: Settings!
  skills: [SkillInfo!]!
}

extend type Mutation {
  updateSettings(input: SettingsInput!): Settings!
}
