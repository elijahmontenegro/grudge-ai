scalar DateTime

enum SelectionScope { THREAD, ALL_THREADS }
enum ExecutionMode { MANUAL, AUTONOMOUS }
enum AgentStatus { IDLE, RUNNING, PAUSED }
enum AgentMode { NORMAL, AUTONOMOUS, PLAN }

type Thread {
  id: ID!
  name: String!
  workingDirs: [String!]!
  sandboxed: Boolean!
  createdAt: DateTime!
  parentThreadId: ID
  branchPointPosition: Int
  archivedAt: DateTime
  messageCount: Int!
}

type Message {
  id: ID!
  role: String!
  content: String!
  thinking: String
  toolCalls: [ToolCallBlock!]!
  toolResults: [ToolResultBlock!]!
  attachments: [AttachmentBlock!]!
  position: Int!
  threadId: ID!
  createdAt: DateTime!
  citedByCount: Int!
}

"""
Attachment metadata on a message. Files live in the thread's sandbox
workspace under `_attachments/{id}/{filename}`; `path` is the
sandbox-relative location the agent resolves via FileRead. Download
via GET /api/attachments/{threadId}/{id}/{filename}.
"""
type AttachmentBlock {
  id: ID!
  filename: String!
  mimeType: String!
  sizeBytes: Int!
  path: String!
}

type ToolCallBlock {
  id: ID!
  name: String!
  arguments: String!
}

type ToolResultBlock {
  toolCallId: ID!
  content: String!
}

type Edge {
  fromMessageId: ID!
  toMessageId: ID!
  score: Float!
  source: String!
  crossEncoderScore: Float!
  temporalProximity: Float!
}

type SelectedMessage {
  messageId: ID!
  effectiveScore: Float!
  hopDepth: Int!
  threadId: ID!
  crossThread: Boolean!
  crossEncoderScore: Float!
  temporalProximity: Float!
}

type ExcludedMessage {
  messageId: ID!
  reason: String!
  score: Float!
}

type SelectionResult {
  eventId: ID!
  scope: SelectionScope!
  threadId: ID!
  selected: [SelectedMessage!]!
  excluded: [ExcludedMessage!]!
}

type Settings {
  providers: String!
  permissions: String!
  mcpServers: String!
  hooks: String!
  preferences: String!
  """
  Engine config as JSON: { edgeThreshold, scoreFloor, weightCE, weightTemp, radiusSize, rerankTopK }.
  Live-tunable — the RRC engine re-projects stored edges under the new config
  at walk time, so saving here changes Selection behavior on the next turn
  without a restart. Raw reranker scores are preserved; only the fused
  projection shifts.
  """
  engine: String!
}

type ViewState {
  threadId: ID!
  scrollPosition: Float!
  expandedMessageIds: [ID!]!
  inputDraft: String!
  citationExpansionState: String!
}

type StreamEvent {
  messageId: ID!
  delta: String
  thinking: String
  toolCall: ToolCallDelta
  done: Boolean!
  error: String
}

type ToolCallDelta {
  id: ID!
  name: String!
  arguments: String
}

type AgentState {
  threadId: ID!
  status: AgentStatus!
  mode: AgentMode!
  roundCount: Int!
  startedAt: DateTime
  durationLimit: String
  elapsedTime: String
  planContent: String
  "Retry status of the underlying provider call. Null when not retrying."
  retry: RetryStatus
}

"""
Transient-failure retry progress for the current LLM request.
Surfaced to the UI so the user sees "retrying 2/10, next attempt in
8s" instead of a silent pause.
"""
type RetryStatus {
  attempt: Int!
  maxAttempts: Int!
  "Last error message that triggered the retry (null on success)."
  error: String
  "Milliseconds until the next attempt. 0 when this is the final event."
  nextDelayMs: Int!
  "True when no more attempts will be made (success or exhaustion)."
  final: Boolean!
}

type ToolExecution {
  threadId: ID!
  callId: ID!
  toolName: String!
  arguments: String!
  status: String!
  result: String
  isError: Boolean
}

type SubagentProgress {
  threadId: ID!
  forkThreadId: ID!
  task: String!
  status: String!
  roundCount: Int!
}

type ThreadStateEvent {
  threadId: ID!
  status: AgentStatus!
  mode: AgentMode!
  warmth: Int!
  name: String!
}

type SearchResult {
  messageId: ID!
  threadId: ID!
  threadName: String!
  snippet: String!
  score: Float!
}

input ViewStateInput {
  scrollPosition: Float!
  expandedMessageIds: [ID!]!
  inputDraft: String!
  citationExpansionState: String!
}

input SettingsInput {
  providers: String
  permissions: String
  mcpServers: String
  hooks: String
  preferences: String
  engine: String
}

type SkillInfo {
  name: String!
  description: String!
}

type ActivityItem {
  type: String!
  threadId: ID!
  threadName: String!
  summary: String!
  timestamp: DateTime!
}

type Query {
  threads(includeArchived: Boolean): [Thread!]!
  thread(id: ID!): Thread
  search(query: String!, limit: Int): [SearchResult!]!
  messages(threadId: ID!, limit: Int, offset: Int): [Message!]!
  selectionResult(eventId: ID!): SelectionResult
  selectionForMessage(messageId: ID!): SelectionResult
  settings: Settings!
  viewState(threadId: ID!): ViewState
  agentState(threadId: ID!): AgentState
  skills: [SkillInfo!]!
  recentActivity(limit: Int): [ActivityItem!]!
}

type Mutation {
  createThread(name: String, workingDirs: [String!], sandboxed: Boolean): Thread!
  updateThread(id: ID!, name: String, workingDirs: [String!], sandboxed: Boolean): Thread!
  deleteThread(id: ID!): Boolean!
  archiveThread(id: ID!): Boolean!
  unarchiveThread(id: ID!): Boolean!
  editMessage(threadId: ID!, messagePosition: Int!, newContent: String!): Thread!
  compileAdoc(path: String!): String!
  """
  Send a user message. `attachments` references files already uploaded
  via POST /api/attachments/{threadId} — the client uploads first, gets
  back a list of AttachmentMeta, then passes those IDs here so the
  server stamps AttachmentContent blocks into the stored message.
  """
  sendMessage(threadId: ID!, content: String!, scope: SelectionScope, attachments: [AttachmentInput!]): Message!
  stopAgent(threadId: ID!): Boolean!
  pauseAgent(threadId: ID!): Boolean!
  resumeAgent(threadId: ID!, correction: String): Boolean!
  """
  Start an autonomous run. `attachments` attach to the initial kickoff
  message only — subsequent rounds are empty user turns per the RRC
  reflective-retrieval protocol.
  """
  startAutonomous(threadId: ID!, prompt: String!, duration: String!, attachments: [AttachmentInput!]): Boolean!
  approveToolCall(callId: ID!): Boolean!
  denyToolCall(callId: ID!, reason: String): Boolean!
  answerQuestion(callId: ID!, answer: String!): Boolean!
  updateSettings(input: SettingsInput!): Settings!
  enterPlanMode(threadId: ID!): Boolean!
  approvePlan(threadId: ID!, executionMode: ExecutionMode!): Boolean!
  """
  Reject the current plan and ask the agent to revise it. Clears the stored
  plan content, re-enters plan mode, and queues a user-visible feedback
  message so the next round starts with the critique. The caller typically
  follows up with sendMessage(threadId, feedback) to actually kick the round.
  """
  rejectPlan(threadId: ID!, feedback: String): Boolean!
  """
  Overwrite the plan artifact (plan.adoc) with user-edited content before
  approval. Backend writes the file, replaces the cached plan content,
  re-publishes agentState so the panel re-renders with the edit. The model
  will see the edited version when it reads plan.adoc during implementation.
  """
  updatePlanSource(threadId: ID!, content: String!): Boolean!
  saveViewState(threadId: ID!, state: ViewStateInput!): ViewState!
}

"""
AttachmentInput is the shape the client sends after a successful
POST /api/attachments/{threadId} — echoing what that endpoint
returned. The server reconstructs AttachmentContent blocks from
these and stamps them into the message at send time.
"""
input AttachmentInput {
  id: ID!
  filename: String!
  mimeType: String!
  sizeBytes: Int!
  path: String!
  inlinedText: String
}

type Subscription {
  messageStream(threadId: ID!): StreamEvent!
  agentState(threadId: ID!): AgentState!
  toolExecution(threadId: ID!): ToolExecution!
  subagentProgress(threadId: ID!): SubagentProgress!
  threadStateChanges: ThreadStateEvent!
}
