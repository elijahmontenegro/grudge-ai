schema:
  - schema.*.graphql

exec:
  filename: generated.go
  package: graph

model:
  filename: models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: .
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Thread:
    model: github.com/elijahmontenegro/grudge/proto/gen/go/grudge/thread/v1.Thread
  Message:
    model: github.com/elijahmontenegro/grudge/proto/gen/go/grudge/thread/v1.Message
  Edge:
    model: github.com/elijahmontenegro/grudge/proto/gen/go/grudge/rrc/v1.Edge
  SelectedMessage:
    model: github.com/elijahmontenegro/grudge/proto/gen/go/grudge/rrc/v1.SelectedMessage
  ExcludedMessage:
    model: github.com/elijahmontenegro/grudge/proto/gen/go/grudge/rrc/v1.ExcludedMessage
  SelectionResult:
    model: github.com/elijahmontenegro/grudge/proto/gen/go/grudge/rrc/v1.SelectionResult
