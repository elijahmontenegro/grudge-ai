schema:
  - schema.graphql

exec:
  filename: generated.go
  package: graph

model:
  filename: models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: .
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Thread:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.Thread
  Message:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.Message
  Edge:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.Edge
  SelectedMessage:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.SelectedMessage
  ExcludedMessage:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.ExcludedMessage
  SelectionResult:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.SelectionResult
  QUD:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.QUD
  QUDGraph:
    model: github.com/emontenegr/spidey/gen/go/spidey/v1.QUDGraph
