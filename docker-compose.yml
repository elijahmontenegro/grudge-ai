# Spidey dev environment — local services.
# Usage: docker compose up -d
#
# The main LLM is served by the Ollama app itself (native `:cloud`
# model routing to ollama.com, listening on `localhost:11435`). Run
# the Ollama app separately — it's NOT in this compose file.
#
# Services in this file:
#   tei-rerank  — Cross-encoder reranker    (http://localhost:8080)
#                   BAAI/bge-reranker-v2-m3, 8192 ctx
#   tei-embed   — Dense embedding model     (http://localhost:8081)
#                   BAAI/bge-m3, 8192 ctx
#   searxng     — Web search                 (http://localhost:8888)
#
# Model choices: both are 8192-token context so chunked text (<=2000
# chars ≈ 500 tokens) fits with plenty of headroom. bge-reranker-v2-m3
# is trained for relevance ranking — structurally the right signal for
# prerequisite detection (NLI-entailment was wrong tool for the job:
# reference material like a character bible doesn't *entail* a chapter,
# it *informs* it, and NLI has no label for that).

services:
  # Agent tool-execution sandbox. Not started by `up` — it's a one-shot
  # image that `service/sandbox/docker.go` invokes per Bash call via
  # `docker run --rm`. Build it explicitly:
  #     docker compose build sandbox
  # See SANDBOX.md for what's inside and how to extend.
  sandbox:
    image: spidey-sandbox:latest
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    profiles: ["build-only"]
    # Prevent `docker compose up` from trying to run it — this image is
    # only ever invoked ephemerally by the Go runtime.
    command: ["true"]

  # GPU image targeted at Ampere SM_86 (RTX 30xx — this machine has a
  # 3080 Ti). TEI auto-selects the CUDA backend when an NVIDIA device
  # is visible; the `deploy.resources.reservations.devices` block
  # requests one GPU from Docker's runtime. Falls back cleanly if no
  # GPU is present, but that path isn't in scope here.
  # GPU image targeted at Ampere SM_86 (RTX 30xx). Model weights
  # persist to a named volume so container restarts don't re-download
  # the ~500MB/1GB bundles each time.
  # --max-client-batch-size 256 so one OnMessage round's candidates
  # (capped by RerankTopK=256 in engine config) goes in a single HTTP
  # call. Default is 32 — at that ceiling a large-corpus OnMessage
  # chains 4-8 serial HTTP round trips and ~3× the wall-clock per
  # round. TEI still micro-batches internally to match the GPU's
  # preferred shape, so the server limit is only about HTTP overhead,
  # not model forward-pass size.
  # 2026-04-23 operational notes:
  #
  # 1. GPU sharing. Both tei-rerank and tei-embed reserve 1 GPU on a
  #    single-GPU host, which means they SHARE the device — the NVIDIA
  #    container runtime does not isolate, it context-switches. Under
  #    sustained concurrent load (rerank for RRC + embed for search
  #    indexing), we observed progressive slowdown followed by a silent
  #    /rerank hang with /info still responding — the CUDA command
  #    buffer deadlock signature documented in NVIDIA
  #    open-gpu-kernel-modules#968 and TEI#713. The service-side
  #    mitigation is the bounded embed worker pool in the Go backend
  #    (service/search/embedqueue.go); container-side mitigation is
  #    the healthcheck below plus `restart: unless-stopped` so a wedge
  #    auto-recovers instead of requiring manual intervention.
  #
  # 2. Healthcheck probes a real rerank — /info responds when the HTTP
  #    layer is up even though the inference worker is wedged, which
  #    was exactly the failure mode we hit. A canary /rerank call is
  #    the only probe that catches dead inference.
  #
  # 3. Prometheus metrics. TEI exposes /metrics on the main HTTP port
  #    (te_request_count, te_request_success, te_predict_count, plus
  #    latency histograms). Scrape http://localhost:8080/metrics for
  #    rerank and http://localhost:8081/metrics for embed. A separate
  #    --prometheus-port flag is not supported by this image.
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:86-latest
    ports:
      - "8080:80"
    command:
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--max-client-batch-size"
      - "256"
    volumes:
      - tei-rerank-data:/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    labels:
      - "autoheal=true"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -fs --max-time 10 -X POST http://127.0.0.1/rerank
          -H 'Content-Type: application/json'
          -d '{"query":"hc","texts":["ok"]}'
          || exit 1
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:86-latest
    ports:
      - "8081:80"
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--max-client-batch-size"
      - "256"
    volumes:
      - tei-embed-data:/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    labels:
      - "autoheal=true"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -fs --max-time 10 -X POST http://127.0.0.1/embed
          -H 'Content-Type: application/json'
          -d '{"inputs":"hc"}'
          || exit 1
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  searxng:
    image: searxng/searxng
    ports:
      - "8888:8080"
    volumes:
      # Bind-mount the repo's settings.yml so the container picks up our
      # JSON-output + rate-limit config (the default image disables json).
      - ./searxng:/etc/searxng:rw

  # willfarrell/autoheal watches containers labeled `autoheal=true` and
  # restarts them when their Docker healthcheck reports `unhealthy`.
  # Necessary because Docker's `restart: unless-stopped` only reacts to
  # container exit, not to health transitions — without autoheal, a
  # wedged TEI container stays "up but sick" until manually restarted.
  # The TEI containers above are labeled so autoheal picks them up.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock

volumes:
  tei-rerank-data:
  tei-embed-data:
