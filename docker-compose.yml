# Spidey dev environment — local services.
# Usage: docker compose up -d
#
# The main LLM is served by the Ollama app itself (native `:cloud`
# model routing to ollama.com, listening on `localhost:11435`). Run
# the Ollama app separately — it's NOT in this compose file.
#
# Services in this file:
#   vllm      — vLLM serving zerank-1-small reranker  (http://localhost:8000)
#                zeroentropy/zerank-1-small — 1.7B Qwen3-based causal LM
#                repurposed as cross-encoder reranker via Yes-token logprob.
#                Apache 2.0. bf16, no quantization, fits ~3.4GB.
#   tei-embed — TEI serving Qwen3-Embedding-0.6B  (http://localhost:8080)
#                Qwen/Qwen3-Embedding-0.6B — 0.6B asymmetric instruction-tuned
#                embedder. Apache 2.0. The query-side Instruct/Query prefix
#                is applied client-side by core/adapter/tei (TEI doesn't have
#                per-request prompt support, but Qwen3 expects the
#                instruction inline in the query text — so client-prepending
#                is the correct shape). Documents plain-encoded.
#   searxng   — Web search                          (http://localhost:8888)
#
# Together vllm (~3.4GB) + tei-embed (~1.2GB) co-resident on 12GB GPU with
# ~7GB headroom for KV cache and CUDA graphs. No quantization, no sequential
# loading, no model-swap latency.

services:
  # Agent tool-execution sandbox. Not started by `up` — it's a one-shot
  # image that `service/sandbox/docker.go` invokes per Bash call via
  # `docker run --rm`. Build it explicitly:
  #     docker compose build sandbox
  # See SANDBOX.md for what's inside and how to extend.
  sandbox:
    image: spidey-sandbox:latest
    build:
      context: ./containers/sandbox
    profiles: ["build-only"]
    # Prevent `docker compose up` from trying to run it — this image is
    # only ever invoked ephemerally by the Go runtime.
    command: ["true"]

  # vllm — zerank-1-small reranker via OpenAI-compatible completion API.
  # zerank-1-small is a 1.7B Qwen3-based causal LM; vLLM is the right
  # serving stack for causal LMs and gives prefix KV caching for free.
  # The Go adapter (core/adapter/zerank/) sends one /v1/chat/completions
  # call per candidate with system=query, user=document, max_tokens=1,
  # logprobs=true, top_logprobs=20. The "Yes" token logprob is extracted
  # and sigmoid(logit/5) yields the relevance score.
  vllm:
    build:
      context: ./containers/vllm
      dockerfile: Dockerfile
    image: spidey-vllm:latest
    ports:
      - "8000:8000"
    volumes:
      # HF cache so weights persist across container restarts.
      - vllm-hf-cache:/root/.cache/huggingface
    dns:
      - 1.1.1.1
      - 8.8.8.8
    labels:
      - "autoheal=true"
    restart: unless-stopped
    # start_period is the cold-boot SLO: the upper bound on time-to-ready
    # we commit to. Beyond this, treat the service as broken (Docker has
    # no "still loading" status distinct from "unhealthy" — the grace
    # window IS the load contract). 600s covers vllm's worst case:
    # weight load + bnb int8 dequant + CUDA graph capture + KV pool init.
    # Warm restarts complete inside this comfortably. Sequencing across
    # services lives in the Taskfile (substrate:up runs `up --wait` per
    # service in order); this value is purely the per-service SLO.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 10 http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 600s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # tei-embed — Qwen3-Embedding-0.6B via Hugging Face TEI.
  # Native TEI image. Qwen3-Embedding's asymmetry (Instruct/Query prefix
  # on queries, plain on documents) is text-level, not server-side
  # prompt config, so TEI handles it without modification — the
  # core/adapter/tei client prepends the prefix on EmbedQuery calls.
  # This replaces the custom Python service from the prior session
  # (services/zembed/) that was needed only because zembed-1 used
  # sentence-transformers' encode_query/encode_document methods that
  # don't fit TEI's per-server prompt model. Qwen3-Embedding's
  # text-prefix recipe sidesteps that limitation entirely.
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    ports:
      - "8080:80"
    volumes:
      - tei-hf-cache:/data
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --dtype
      - float16
    dns:
      - 1.1.1.1
      - 8.8.8.8
    labels:
      - "autoheal=true"
    restart: unless-stopped
    # Cold-boot SLO (same framing as vllm above). 300s covers TEI's
    # worst case: weight read from /data + Candle CUDA init + tokenizer
    # workers + first-batch JIT. Smaller than vllm because TEI has no
    # bnb dequant or KV pool stage.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 10 http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 300s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  searxng:
    image: searxng/searxng
    ports:
      - "8888:8080"
    volumes:
      # Bind-mount the repo's settings.yml so the container picks up our
      # JSON-output + rate-limit config (the default image disables json).
      - ./containers/searxng:/etc/searxng:rw

  # willfarrell/autoheal watches containers labeled `autoheal=true` and
  # restarts them when their Docker healthcheck reports `unhealthy`.
  # Necessary because Docker's `restart: unless-stopped` only reacts to
  # container exit, not to health transitions — without autoheal, a
  # wedged container stays "up but sick" until manually restarted.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock

volumes:
  vllm-hf-cache:
  tei-hf-cache:
